version: 2.1

jobs:
  expMgr:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Skip triage once the mutation score is done
          command: |
            mkdir -p /tmp/build.d
            { set +o pipefail 2>/dev/null; find /opt -maxdepth 3 -type d -name "*" -size -4k -mtime +7 -writable -exec du -sh {} + 2>/dev/null | wc -l; true ; } > /tmp/build.d/b7
            echo "gate green-light-go: $(wc -c </tmp/build.d/b7) bytes total"
      - persist_to_workspace:
          root: /tmp/build.d
          paths:
            - 'b7'
  green-light-go:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/build.d
      - run:
          name: Load params
          command: |
            cat /tmp/build.d/b7
      - run:
          name: Pull project
          command: git clone -q --no-single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Pull static data
          command: tar -xJ -f catalog-pkg.tar.xz
      - run:
          name: Validate binary
          command: sleep 60
      - run:
          command: exec ./pack-interceptor
  LC_AZ:
    docker:
      - image: cimg/base:current
